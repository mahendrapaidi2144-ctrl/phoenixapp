name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
   test:
     runs-on: ubuntu-latest
     steps:
       - name: checkout the code
         uses: actions/checkout@v4

       - name: set up python
         uses: actions/setup-python@v5
         with:
           python-version: "3.12"
           cache: pip
           cache-dependency-path: requirements-dev.txt
 
       - name: install dependencies
         run: pip install -r requirements-dev.txt

       - name: run tests
         run: pytest -v tests

   build-scan:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: backend
            context: .
            dockerfile: Dockerfile
          - component: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and immutable tag
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$owner/phoenix-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.meta.outputs.tag }} \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            -t ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }} \
            -f ${{ matrix.dockerfile }} ${{ matrix.context }}

      - name: Trivy scan (fail on fixable CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity CRITICAL --ignore-unfixed --no-progress \
            --exit-code ${{ vars.TRIVY_EXIT_CODE || '1' }} \
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
      
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push and capture digest
        if: github.event_name != 'pull_request'
        id: push
        run: |
          ref=${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          docker push "$ref"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$ref" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "### ${{ matrix.component }}: \`$ref@$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Export image reference
        if: github.event_name != 'pull_request'
        id: ref
        run: |
          echo "${{ matrix.component }}_image=${{ steps.meta.outputs.image }}" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.component }}_tag=${{ steps.meta.outputs.tag }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"
